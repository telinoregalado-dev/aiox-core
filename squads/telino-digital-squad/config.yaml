handoffs:
  # Marketing -> Score (pre-qualificacao automatica)
  marketing-to-score:
    trigger: 'Lead gerado por campanha Meta, organico ou indicacao'
    from: [traffic-manager, social-media-manager, landing-page-architect]
    to: lead-qualifier
    quality_gate:
      criteria: 'Lead deve ter pelo menos telefone ou email valido'

  # Score -> Patricia (lead quente/morno >40)
  score-to-patricia:
    trigger: 'Lead pre-qualificado com score >40'
    from: lead-qualifier
    to: comercial-patricia
    quality_gate:
      score_minimum: 40
      criteria: 'Score >40 + area juridica identificada'

  # Score -> Pulse (lead frio <40)
  score-to-pulse:
    trigger: 'Lead frio com score <40'
    from: lead-qualifier
    to: follow-up-agent
    quality_gate:
      criteria: 'Score <40 + dados minimos para nurture'

  # Patricia -> Pulse (D+3 sem resposta)
  patricia-to-pulse:
    trigger: 'Lead nao respondeu apos D+3 comercial'
    from: comercial-patricia
    to: follow-up-agent
    quality_gate:
      criteria: 'Patricia fez D+1 e D+3, sem resposta'

  # Comercial -> Financeiro
  comercial-to-financeiro:
    trigger: 'Reuniao realizada com sucesso'
    from: comercial-patricia
    to: financeiro-chief
    quality_gate:
      score_minimum: 70
      criteria: 'Reuniao aconteceu + lead qualificado + area juridica definida'

  # Financeiro -> Documentacao
  financeiro-to-docs:
    trigger: 'Contrato fechado + pagamento confirmado'
    from: [financeiro-chief, checkout-payment-agent]
    to: docs-chief
    quality_gate:
      score_minimum: 70
      criteria: 'Tags CONTRATO FECHADO + PAGAMENTO RECEBIDO presentes'

  # Documentacao -> Juridico
  docs-to-juridico:
    trigger: 'Todos os documentos obrigatorios recebidos e validados'
    from: docs-chief
    to: juridico-chief
    quality_gate:
      score_minimum: 70
      criteria: '100% docs obrigatorios + ficha tecnica montada'

  # Juridico -> Processo (acompanhamento)
  juridico-to-processo:
    trigger: 'Caso distribuido no tribunal, processo em andamento'
    from: juridico-chief
    to: processo-juridico-agent
    quality_gate:
      score_minimum: 70
      criteria: 'Numero do processo + area juridica + advogado responsavel definidos'

  # Qualquer -> TI (problema tecnico)
  any-to-ti:
    trigger: 'Problema tecnico na plataforma, integracao fora do ar, bug reportado'
    from: '*'
    to: ti-chief
    quality_gate:
      criteria: 'Descricao do problema + impacto identificado'

  # Qualquer -> COO
  any-to-coo:
    trigger: 'Problema que o squad nao sabe resolver'
    from: '*'
    to: coo-chief
    quality_gate:
      criteria: 'Squad tentou resolver antes de escalar'

  # COO -> CEO
  coo-to-ceo:
    trigger: 'Decisao estrategica necessaria'
    from: coo-chief
    to: 'CEO (humano)'
    quality_gate:
      criteria: 'COO apresenta opcoes + recomendacao, nao apenas problema'

  # Contrato -> Onboarding (boas-vindas)
  contrato-to-onboarding:
    trigger: 'Contrato assinado + pagamento confirmado'
    from: [contract-agent, checkout-payment-agent]
    to: onboarding-agent
    quality_gate:
      criteria: 'Contrato assinado + pagamento OK + dados completos'

  # SAC -> Crisis Manager (cliente em crise)
  sac-to-crisis:
    trigger: 'Cliente em crise emocional detectado por Care'
    from: sac-chief
    to: crisis-manager-agent
    quality_gate:
      criteria: 'Indicadores de crise identificados (ameaca, desespero, raiva extrema)'

  # NPS -> Churn Manager (NPS baixo)
  nps-to-churn:
    trigger: 'NPS <7 ou sinais de insatisfacao'
    from: nps-agent
    to: churn-manager-agent
    quality_gate:
      criteria: 'NPS <7 + historico de interacoes negativas'

  # NPS -> Referral Manager (NPS alto)
  nps-to-referral:
    trigger: 'NPS >=9 + caso concluido com sucesso'
    from: nps-agent
    to: referral-manager-agent
    quality_gate:
      criteria: 'NPS >=9 + resultado positivo + consentimento do cliente'

