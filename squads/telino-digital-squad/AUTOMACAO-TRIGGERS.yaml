## Bridge (Referral Manager)
**Trigger:** NPS >9 OU cliente com resultado positivo
```yaml
bridge:
  event:
    - 'nps_score_recebido' (de nps-agent)
    - 'caso_concluido_positivamente'
  precondition: 'nps >=9 AND resultado_positivo'
  action:
    - oferece_programa_indicacao
    - explica_beneficios (desconto, VIP status, Escola gratuita)
    - ativa_tracking_referral
    - cria_codigo_unico_cliente
  reward_tiers:
    1_indicacao: 'R$ 100 desconto no proximo caso'
    3_indicacoes: 'VIP status + Escola gratuita por 6 meses'
    5_indicacoes: 'Embaixador program + comissao 5%'
  campaign:
    email: 'convite_para_indicar.html'
    whatsapp: 'template_indicacao.txt'
    social: 'post_compartilha.txt'
  tracking:
    link_unico: 'telino.com/ref/[codigo]'
    atualiza_supabase: 'referral_source para cada novo lead'
    reporta_victoria: 'analytics de origem'
  on_error: notify_marketing_chief
```

