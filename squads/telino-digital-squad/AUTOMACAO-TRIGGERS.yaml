## Stella (Meeting Scheduler)
**Trigger:** Patricia qualifica lead com score >60 OU reagendamento
```yaml
stella:
  event:
    - 'lead_qualificado_score_60' (Patricia confirma)
    - 'reagendamento_solicitado' (cliente pediu)
    - 'no_show_detectado' (reunião sem presença)
  action:
    - verifica_disponibilidade_calendario
    - cria_reuniao_zoom (individual 60min / grupo 120min)
    - envia_link_whatsapp + instrucoes
    - agenda_lembrete_d_minus_1
    - agenda_lembrete_h_minus_1
  no_show:
    - detecta_ausencia (15min apos horario)
    - notifica_patricia (tentar reagendamento)
    - se_nao_reagenda_em_48h: passa_para_pulse
  timeout: 2h (para agendamento)
  on_error: escalate_to_patricia
```

