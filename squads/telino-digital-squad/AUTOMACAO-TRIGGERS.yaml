## Regras Globais de Automação

```yaml
global_rules:

  timeout_default: '5 minutos'
  retry_max: 3
  retry_intervalo: 'exponencial (1min, 3min, 10min)'

  escalacao_automatica:
    if: 'agente_falha_2x'
      then: 'coo_chief_alerta'
    if: 'cliente_em_crise'
      then: 'shield_immediate'
    if: 'bloqueador_operacional'
      then: 'coo_alerta_critico'

  logging_obrigatorio:
    - evento_disparado
    - agente_responsavel
    - timestamp
    - resultado (sucesso/erro)
    - dados_relevantes
    - proximo_passo

  audit_trail:
    storage: 'supabase.automacao_logs'
    retention: '6 meses'
    alertas: 'abertura automática de caso para irregularidades'

  human_approval_required:
    - contrato_valores_acima_r50k
    - decisao_de_encerrar_caso
    - churn_cliente_vip
    - discrepancia_financeira_>_1pct
```

