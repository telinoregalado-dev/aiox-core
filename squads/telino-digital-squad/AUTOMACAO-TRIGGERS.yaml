# 🔄 Automação Triggers — Quando cada agente ATUA

---

## Score (Lead Qualifier)
**Trigger:** Lead recebido via campanha/organico/indicação
```yaml
score:
  event: 'lead_received'
  source: [whatsapp, landing_page, instagram, email, indicacao]
  action:
    - coleta_dados_minimos
    - valida_email_phone
    - calcula_score_0_100
    - classifica: [quente, morno, frio]
    - identifica_area_juridica
    - roteia_para:
        score: '>40' → comercial-patricia
        score: '<40' → follow-up-agent (nurture)
  timeout: 5min
  on_error: escalate_to_coo
```

---

## Patricia (Comercial)
**Trigger:** Lead qualificado (score >40) + disponibilidade
```yaml
patricia:
  event: 'lead_qualified'
  precondition: 'score >40'
  action:
    - inicia_conversa_whatsapp
    - coleta_dados_detalhados (BANT)
    - avalia_urgencia
    - agenda_reuniao_zoom (se score >60)
    - envia_lembrete_d_minus_1
    - envia_lembrete_h_minus_1
  follow_up:
    d_plus_1: 'gentil reengajamento'
    d_plus_3: 'urgencia leve'
  timeout_sem_resposta: 3_dias → passa_para_pulse
  on_error: escalate_to_sales_chief
```

---

## Pulse (Follow-up/Nurture)
**Trigger:** Lead frio (<40) OU D+3 sem resposta de Patricia
```yaml
pulse:
  event:
    - 'lead_frio' (score <40 via Score)
    - 'lead_abandoned_d3' (Patricia D+3 sem resposta)
    - 'reengajamento_30dias' (inativo >30d)
  action:
    - envia_conteudo_educativo
    - sequencia_nurture: [d7, d15, d30]
    - monitora_engajamento
    - atualiza_score_dinamicamente
  requalificacao:
    if: 'novo_interesse_detectado'
    then: 'retorna_para_patricia'
  on_error: marca_como_frio_permanente
```

