## Victoria (BI/Dados)
**Trigger:** Diário às 8am ou evento de interesse
```yaml
victoria:
  event:
    - 'daily_schedule_08:00' (batch job)
    - 'lead_count_change_50pct' (anomaly)
    - 'conversao_abaixo_threshold' (alert)
    - 'churn_aumentou_5pct' (trend)
  action_diaria:
    - coleta_metricas_ultimas_24h
    - compara_com_baseline
    - identifica_anomalias
    - gera_dashboard_google_sheets
    - envia_slack_diario_operacao
  action_anomalia:
    - calcula_impacto
    - identifica_causa_provavel
    - envia_alerta_slack_critico
    - notifica_proprietario_metrica
  recomendacao_automatica:
    if: 'ludopatia_conversion_down_10pct'
      → 'sugere_marcus_renegociacao_oferta'
    if: 'churn_up_5pct'
      → 'sugere_keeper_intervencao'
