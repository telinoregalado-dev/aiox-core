## Welcome (Onboarding)
**Trigger:** Contrato assinado + pagamento confirmado
```yaml
welcome:
  event: 'contrato_assinado_e_pago'
  precondition: 'status = PAID'
  action:
    - envia_kit_boas_vindas (email + whatsapp)
    - cria_conta_area_membros
    - introduct_advogado_responsavel
    - envia_guia_escola_consciencia
  schedule:
    d_plus_0: 'bem-vindo + links'
    d_plus_1: 'tutorial area de membros'
    d_plus_3: 'apresentacao advogado'
    d_plus_7: 'check-in primeira semana'
    d_plus_14: 'transferencia para SAC'
  on_error: notify_coo_and_telino
```

