## Shield (Crisis Manager)
**Trigger:** Cliente em crise detectado por SAC/Mirror/Processo-Juridico
```yaml
shield:
  event:
    - 'cliente_em_crise' (detectado por SAC-Chief ou Mirror)
    - 'ameaca_suicida' (immediate escalation — qualquer agente)
    - 'sentenca_adversa' (Processo-Juridico detecta decisão negativa)
    - 'cliente_irritado_extremo' (SAC score raiva >8)
  action:
    hour_1:
      - detecta_urgencia
      - classifica_tipo_crise
      - ativa_protocolo_especifico
    hour_2:
      - redige_comunicacao_empática
      - coordena_com_telino (suporte)
      - coordena_com_marcus (negociacao)
    hour_4:
      - entrega_resposta_cliente
      - valida_recepcao
    day_1:
      - follow_up
      - avalia_proximas_acoes
  escalate_if: 'suicidal_ideation' → CVV_188 + humano_immediate
  on_error: escalate_coo_and_telino
```

