## WhatsApp Gateway (Echo)
**Trigger:** CEO envia mensagem no WhatsApp pessoal
```yaml
echo:
  event: 'ceo_whatsapp_message_recebida'
  action:
    - normaliza_comando
    - identifica_intent (operacional/estrategico/urgent)
    - executa_automacao_correspondente
    - confirma_recebimento_ceo
    - publica_no_slack_operacao
  comandos_exemplo:
    'aumenta ludopatia 30%' → ativa_catalyst_workflow
    'qual conversao ludopatia' → query_victoria_bi
    'falta doc cliente xyz' → query_docs_chief
    'crise em recife' → alert_shield_team
  on_error: pede_clarificacao_ceo
```

