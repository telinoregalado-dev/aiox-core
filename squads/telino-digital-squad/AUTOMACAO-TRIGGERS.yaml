## Deal (Proposal Agent)
**Trigger:** Reunião realizada com sucesso
```yaml
deal:
  event:
    - 'reuniao_realizada' (Meeting-Scheduler confirma presença)
    - 'solicitacao_proposta' (Patricia ou Sales-Chief pede)
  precondition: 'area_juridica + valor_estimado + dados_cliente'
  action:
    - gera_proposta_por_area_juridica
    - calcula_valor (tabela + complexidade)
    - envia_proposta_whatsapp + email
    - agenda_follow_up_48h
  proposta_aceita:
    - envia_para_sign (Contract-Agent)
  proposta_rejeitada:
    - notifica_marcus (negociacao estratégica)
    - se_objecao_preco: marcus_reframe
    - se_desistiu: passa_para_pulse (nurture longo)
  timeout: 7_dias → lembrete_proposta → 14_dias → passa_para_pulse
  on_error: escalate_to_sales_chief
```

