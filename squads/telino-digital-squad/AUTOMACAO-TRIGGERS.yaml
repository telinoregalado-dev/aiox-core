## Keeper (Churn Manager)
**Trigger:** Churn score >60 OU padrões de desengajamento
```yaml
keeper:
  event:
    - 'churn_score_gerado' (Victoria calcula diariamente)
    - 'cliente_inativo_10dias'
    - 'documentos_parados_15dias'
    - 'nao_abriu_email_7dias'
  churn_score:
    0-30: 'saudavel' → sem_acao
    31-60: 'atencao' → check_in_automatico
    61-80: 'risco_alto' → intervencao_pessoal_telino
    81-100: 'critico' → resgate_marcus + regalado
  action:
    if: 'score 31-60'
      - envia_check_in (whatsapp humanizado)
      - oferece_suporte_extra
    if: 'score 61-80'
      - ativa_telino (mentora acolhimento)
      - oferece_sessao_escola_consciencia
    if: 'score 81-100'
      - ativa_marcus (negociacao de permanencia)
      - oferta_especial_retencao
  retry:
    max_tentativas: 3
    intervalo: 3_dias
  on_recover: volta_para_saudavel, comemora_com_slack
  on_churn: documenta_motivo_para_victoria_analytics
```

