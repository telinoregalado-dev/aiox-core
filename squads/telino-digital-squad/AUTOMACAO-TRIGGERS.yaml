## Marcus (Negociador)
**Trigger:** Lead hesitante OU oportunidade de renegociacao
```yaml
marcus:
  event:
    - 'lead_com_objecao_preco' (Patricia sinaliza)
    - 'cliente_quer_descontar' (SAC sinaliza)
    - 'churn_score_81_100' (Keeper escala)
    - 'victoria_recomenda_upsell' (BI sugere)
  action:
    - analisa_objecao
    - prepara_3_angulos_resposta
    - coordena_com_sophia_neura (dinamica sistêmica + neuro)
    - apresenta_oferta_reestruturada
    - acompanha_decisao
  integracao:
    with: [sophia (familiar), neura (neuro), victoria (dados)]
    request: 'contexto_completo_cliente'
    deliverable: 'proposta_customizada'
  on_success: 'contrato_renegociado → documentar_learnings'
  on_failure: 'escala_para_regalado_mentoring'
```

