## Regras Globais de Automação

```yaml
global_rules:

  timeout_default: '5 minutos'
  retry_max: 3
  retry_intervalo: 'exponencial (1min, 3min, 10min)'

  # HORÁRIO DE ENVIO (OBRIGATÓRIO para todos os agentes)
  horario_envio:
    whatsapp:
      seg_sex: '08:00 - 20:00'
      sabado: '09:00 - 14:00'
      domingo: 'NÃO ENVIAR (exceto crise Shield)'
      feriados: 'NÃO ENVIAR (exceto crise Shield)'
    email:
      seg_sex: '07:00 - 21:00'
      sabado: '08:00 - 18:00'
      domingo: '10:00 - 16:00 (apenas automáticos)'
    fuso_horario: 'America/Recife (BRT -3)'
    excecao: 'Shield (crise) pode enviar 24/7'
    fila: 'mensagens fora do horário entram em fila e saem no próximo horário válido'

  # LGPD / OPT-OUT (OBRIGATÓRIO para todos os agentes)
  lgpd:
    opt_out:
      - 'SE cliente pedir para parar: TODOS os agentes param IMEDIATAMENTE'
