## Conselho Automação (Catalyst)
**Trigger:** Decisão do Conselho G7
```yaml
catalyst:
  event: 'conselho_decisao_documentada'
  precondition: 'em OSMOSE protocol'
  action:
    - normaliza_decisao_para_operacao
    - identifica_agentes_responsaveis
    - cria_tasks_automaticas
    - envia_diretivas_slack
    - agenda_checkins
    - configura_metricas_acompanhamento
  exemplo:
    decisao: 'aumentar ludopatia em 30%'
    automacao:
      - aumenta_orcamento_trafego_30pct
      - cria_campanha_meta_ludopatia
      - realoca_patricia_time_ludopatia
      - cria_metric_alert_conversion_ludopatia
      - agenda_check_in_dia_7
  on_error: escalate_coo_e_conselho
```

