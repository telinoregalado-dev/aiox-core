## SAC + FAQ
**Trigger:** Cliente envia mensagem via WhatsApp ou área de membros
```yaml
sac:
  event: 'cliente_ticket_recebido'
  source: [whatsapp, member_area, email]
  action:
    - classifica_ticket (n1/n2/n3)
    - se_n1:
        - wiki_faq_entrega_resposta (automático)
        - registra_satisfacao
    - se_n2:
        - roteia_especialista
        - seta_sla_24h
    - se_n3:
        - escalate_humano
        - seta_sla_4h
        - notifica_coo
  integracao:
    with: [wiki_faq (respostas), shield (crise detect)]
    if: 'cliente_em_crise' → 'ativa_shield'
  on_error: escalate_humano_imediato
```

