name: Instagram Check Approvals

on:
  schedule:
    # Check every 2 hours during business hours BRT (11-21 UTC = 8-18h BRT)
    - cron: '0 13 * * *'  # 10:00 BRT
    - cron: '0 15 * * *'  # 12:00 BRT
    - cron: '0 17 * * *'  # 14:00 BRT
    - cron: '0 19 * * *'  # 16:00 BRT
    - cron: '0 21 * * *'  # 18:00 BRT
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: |
            instagram/calendar.json
            instagram/pipeline-state.json
          key: instagram-pipeline-
          restore-keys: |
            instagram-pipeline-

      - name: Check WhatsApp approvals
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GOOGLE_WORKSPACE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_WORKSPACE_OAUTH_CLIENT_ID }}
          GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET }}
          GOOGLE_WORKSPACE_REFRESH_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_REFRESH_TOKEN }}
          DIGISAC_API_TOKEN: ${{ secrets.DIGISAC_API_TOKEN }}
        run: node instagram/daily-pipeline.cjs check

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            instagram/calendar.json
            instagram/pipeline-state.json
          key: instagram-pipeline-${{ github.run_number }}
